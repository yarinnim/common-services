log_format socket_server '$remote_addr - [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" "$gzip_ratio"'
    '"$fastcgi_script_name"';

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name socket-server.loc www.socket-server.loc;
  client_max_body_size 100M;

  access_log /var/log/nginx/socket-server.log socket_server;
  error_log /var/log/nginx/socket-server.rror.log debug;

  location / {
    proxy_http_version 1.1;
    proxy_pass http://common-dev_socket-server:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr/swarmpit;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
  }

}
